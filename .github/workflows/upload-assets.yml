name: upload-release-assets
on:
  push:
    paths: ['.github/workflows/upload-assets.yml']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum download/*.apk
          gh release upload v1.2 download/MohrVpn-1.2.apk download/MohrVpn-1.2-arm64.apk --clobber
